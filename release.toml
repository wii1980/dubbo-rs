# cargo-release configuration for dubbo-rs workspace
# Each sub-crate maintains its own independent version number.

allow-branch = ["main"]

shared-version    = false
dependent-version = "upgrade"
metadata          = "optional"

consolidate-commits        = true
pre-release-commit-message = "chore: release"

tag         = true
tag-name    = "{{crate_name}}-v{{version}}"
tag-message = "chore({{crate_name}}): release v{{version}}"

push        = true
push-remote = "origin"

publish = true
verify  = true

[rate-limit]
new-packages      = 50
existing-packages = 30

